<dialog class="zoom-dialog" aria-label="放大檢視圖表">
  <div class="zoom-bar">
    <button type="button" data-z="out" aria-label="縮小">−</button>
    <output>100%</output>
    <button type="button" data-z="in" aria-label="放大">＋</button>
    <button type="button" data-z="fit">符合視窗</button>
    <button type="button" data-z="close" aria-label="關閉">✕ 關閉</button>
  </div>
  <div class="zoom-stage"></div>
</dialog>
<script>
// Each diagram gets a 「⤢ 放大」 button that opens it alone in a native <dialog>.
// Defined before the Mermaid script so mermaid.run().then(addZoom) can call it.
function addZoom() {
  var dlg = document.querySelector('.zoom-dialog');
  var stage = dlg.querySelector('.zoom-stage');
  var out = dlg.querySelector('output');
  var svg, baseW, scale = 1;

  function apply() {
    scale = Math.min(8, Math.max(0.2, scale));
    svg.style.width = baseW * scale + 'px';
    out.textContent = Math.round(scale * 100) + '%';
  }
  function fit() {
    var vb = svg.viewBox.baseVal;
    scale = Math.min(2, (stage.clientWidth - 48) / vb.width, (stage.clientHeight - 48) / vb.height);
    apply();
  }

  dlg.querySelector('.zoom-bar').addEventListener('click', function (e) {
    var z = e.target.closest('button');
    if (!z) return;
    if (z.dataset.z === 'in') { scale *= 1.25; apply(); }
    if (z.dataset.z === 'out') { scale /= 1.25; apply(); }
    if (z.dataset.z === 'fit') fit();
    if (z.dataset.z === 'close') dlg.close();
  });
  // Trackpad pinch / Ctrl + scroll zooms; plain scroll pans.
  stage.addEventListener('wheel', function (e) {
    if (!e.ctrlKey) return;
    e.preventDefault();
    scale *= e.deltaY < 0 ? 1.1 : 1 / 1.1;
    apply();
  }, { passive: false });
  // Click on the dark backdrop closes it.
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });

  document.querySelectorAll('.mermaid').forEach(function (box) {
    var src = box.querySelector('svg');
    if (!src) return;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'zoom-btn';
    btn.textContent = '⤢ 放大';
    btn.setAttribute('aria-label', '放大檢視這張圖');
    btn.addEventListener('click', function () {
      svg = src.cloneNode(true);
      svg.removeAttribute('style');
      baseW = svg.viewBox.baseVal.width;
      stage.replaceChildren(svg);
      dlg.showModal();
      fit();
    });
    box.appendChild(btn);
  });
}
</script>

<script>
(function () {
  var c = document.getElementById('hero-canvas');
  if (!c) return;
  var ctx = c.getContext('2d');
  var w, h, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    w = c.clientWidth; h = c.clientHeight;
    c.width = w * dpr; c.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // Monad-style atmospheric washes: soft pastel radial blobs,
  // plus hairline pipeline nodes connected by thin curved ash lines.
  function blob(x, y, r, color) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(246,243,241,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function node(x, y, label) {
    ctx.font = '11px "IBM Plex Mono", monospace';
    var tw = ctx.measureText(label).width;
    var pw = tw + 28, ph = 24;
    ctx.beginPath();
    ctx.roundRect(x - pw / 2, y - ph / 2, pw, ph, 12);
    ctx.fillStyle = 'rgba(246,243,241,0.85)';
    ctx.fill();
    ctx.strokeStyle = '#cecac8';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#4e4d4d';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x, y + 0.5);
    return { x: x, y: y, w: pw };
  }

  function link(a, b) {
    var x1 = a.x + a.w / 2, x2 = b.x - b.w / 2;
    var c = Math.min(60, Math.max(4, (x2 - x1) / 2));
    ctx.beginPath();
    ctx.moveTo(x1, a.y);
    ctx.bezierCurveTo(x1 + c, a.y, x2 - c, b.y, x2, b.y);
    ctx.strokeStyle = '#cecac8';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);

    // pastel washes behind content
    blob(w * 0.12, h * 0.15, w * 0.22, 'rgba(255,148,115,0.35)');  // coral
    blob(w * 0.88, h * 0.2,  w * 0.2,  'rgba(160,181,235,0.45)'); // sky
    blob(w * 0.78, h * 0.95, w * 0.18, 'rgba(167,252,205,0.4)');  // mint
    blob(w * 0.05, h * 0.9,  w * 0.14, 'rgba(236,218,152,0.4)');  // gold

    // pipeline node chains in the clear band below the meta row:
    // two edge groups when wide, one centered row, or two stacked rows.
    var G1 = ['FIXTURES', 'JSON SERVER', 'LOCAL STORE'];
    var G2 = ['3 ACCOUNTS', 'TEST CLOCK', 'FE-01–48'];
    ctx.font = '11px "IBM Plex Mono", monospace';
    var gap = 56;
    function chainWidth(labels) {
      var t = 0;
      labels.forEach(function (l) { t += ctx.measureText(l).width + 28; });
      return t + gap * (labels.length - 1);
    }
    function drawChain(labels, cx, y) {
      var widths = labels.map(function (l) { return ctx.measureText(l).width + 28; });
      var total = widths.reduce(function (a, b) { return a + b; }, 0) + gap * (labels.length - 1);
      var x = cx - total / 2, prev = null;
      labels.forEach(function (l, i) {
        var n = node(x + widths[i] / 2, y, l);
        if (prev) link(prev, n);
        prev = n;
        x += widths[i] + gap;
      });
    }
    var w1 = chainWidth(G1), w2 = chainWidth(G2);
    if (w1 + w2 + 120 < w) {
      var y1 = h * 0.86;
      drawChain(G1, w1 / 2 + 24, y1);
      drawChain(G2, w - w2 / 2 - 24, y1);
    } else if (Math.max(w1, w2) < w - 40) {
      drawChain(G1, w / 2, h * 0.8);
      drawChain(G2, w / 2, h * 0.93);
    }
  }

  window.addEventListener('resize', resize);
  resize();
})();
</script>
